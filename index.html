<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Simple. Fast. Easy Access.</title>
  <style>
    :root {
      --ink: #090909;
      --orange: #ee980e;
      --orange-light: #ffbd45;
      --muted-line: #e7e7e7;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: #fff;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      overflow: hidden;
    }

    .page {
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      min-height: 100svh;
      padding: 40px 22px;
      overflow: hidden;
      border: 1px solid #ededed;
      border-radius: 12px;
    }

    /* Decorative circles inspired by the reference image. */
    .orb {
      position: absolute;
      z-index: -1;
      pointer-events: none;
      border-radius: 50%;
    }

    .orb-top-black {
      width: clamp(260px, 33vw, 560px);
      aspect-ratio: 1;
      right: clamp(-110px, -4.7vw, -50px);
      top: clamp(-250px, -13vw, -95px);
      background: var(--ink);
    }

    .orb-top-ring {
      width: clamp(440px, 54vw, 920px);
      aspect-ratio: 1;
      right: clamp(-260px, -8vw, -90px);
      top: clamp(-330px, -17vw, -130px);
      border: 1.5px solid #ffb33e;
    }

    .orb-bottom-grey {
      width: clamp(420px, 47vw, 770px);
      aspect-ratio: 1;
      left: clamp(-250px, -5vw, -85px);
      bottom: clamp(-390px, -21vw, -160px);
      border: 1px solid var(--muted-line);
    }

    .orb-bottom-orange {
      width: clamp(330px, 39vw, 640px);
      aspect-ratio: 1;
      left: clamp(-220px, -4vw, -70px);
      bottom: clamp(-350px, -20vw, -150px);
      border: 1.5px solid #ffbd5b;
    }

    .content {
      width: min(100%, 780px);
      margin-top: -8px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 7.1vw, 7rem);
      font-weight: 820;
      letter-spacing: -0.075em;
      line-height: 0.99;
    }

    h1 span { display: block; }
    h1 .accent { color: var(--orange); margin-top: 7px; }

    .download-wrap { margin-top: clamp(34px, 5vw, 72px); }

    .download-button {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      min-height: 82px;
      padding: 10px 47px 10px 13px;
      border: 0;
      border-radius: 999px;
      background: var(--ink);
      color: #fff;
      font: inherit;
      font-size: 1.25rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 24px 40px rgba(0, 0, 0, 0.08);
      transition: transform 160ms ease, box-shadow 160ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .download-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 28px 44px rgba(0, 0, 0, 0.12);
    }

    .download-button:active { transform: translateY(0) scale(0.99); }
    .download-button:focus-visible { outline: 3px solid var(--orange-light); outline-offset: 5px; }

    .arrow-circle {
      display: grid;
      place-items: center;
      flex: 0 0 61px;
      width: 61px;
      height: 61px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffc64e, #e99500);
      color: #080808;
    }

    .arrow-circle svg { width: 25px; height: 25px; }

    .hint {
      margin: 18px 0 0;
      color: #767676;
      font-size: 0.82rem;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .page {
        min-height: 100svh;
        padding: 30px 18px;
        border-radius: 0;
      }

      .content { margin-top: -18px; }

      h1 {
        font-size: clamp(2.75rem, 12vw, 4.4rem);
        letter-spacing: -0.07em;
        line-height: 1.02;
      }

      h1 .accent { margin-top: 8px; }

      .download-wrap { margin-top: 38px; }

      .download-button {
        min-height: 72px;
        gap: 14px;
        padding: 8px 32px 8px 9px;
        font-size: 1.1rem;
      }

      .arrow-circle { flex-basis: 55px; width: 55px; height: 55px; }
      .orb-top-black { width: 260px; right: -115px; top: -130px; }
      .orb-top-ring { width: 410px; right: -200px; top: -180px; }
      .orb-bottom-grey { width: 390px; left: -220px; bottom: -220px; }
      .orb-bottom-orange { width: 300px; left: -170px; bottom: -180px; }
      .hint { max-width: 280px; margin-inline: auto; margin-top: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>

  <!-- Meta Pixel Code -->
<script>
!function(f,b,e,v,n,t,s)

</head>
<body>
  <main class="page">
    <div class="orb orb-top-black" aria-hidden="true"></div>
    <div class="orb orb-top-ring" aria-hidden="true"></div>
    <div class="orb orb-bottom-grey" aria-hidden="true"></div>
    <div class="orb orb-bottom-orange" aria-hidden="true"></div>

    <section class="content" aria-labelledby="headline">
      <h1 id="headline">
        <span>Simple. Fast.</span>
        <span class="accent">Easy Access.</span>
      </h1>

      <div class="download-wrap">
        <a class="download-button" id="downloadButton" href="#download" aria-label="Download file">
          <span class="arrow-circle" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" role="presentation">
              <path d="M4.5 12h14M12.5 5.5 19 12l-6.5 6.5" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <span>Download</span>
        </a>
        <p class="hint" id="downloadHint">Tap the button to get your file.</p>
      </div>
    </section>
  </main>

  <script>
    /*
      PASTE YOUR DOWNLOAD LINK HERE.
      Example: const DOWNLOAD_URL = "https://example.com/my-file.apk";
      Use a direct/public link to the file, not just the page where it is described.
    */
    const DOWNLOAD_URL = "https://play.google.com/store/apps/details?id=com.kalyanmatka99.matkaking&hl=en_IN";

    const downloadButton = document.getElementById("downloadButton");
    const downloadHint = document.getElementById("downloadHint");

    if (DOWNLOAD_URL !== "PASTE_YOUR_DOWNLOAD_LINK_HERE" && DOWNLOAD_URL.trim() !== "") {
      downloadButton.href = DOWNLOAD_URL;
      downloadButton.target = "_blank";
      downloadButton.rel = "noopener noreferrer";
      downloadHint.textContent = "Your download is ready.";
    } else {
      downloadButton.addEventListener("click", function (event) {
        event.preventDefault();
        downloadHint.textContent = "Add your download link in index.html first (search for DOWNLOAD_URL).";
      });
      downloadHint.textContent = "Add your file link in the HTML to activate downloads.";
    }
  </script>
</body>
</html>
